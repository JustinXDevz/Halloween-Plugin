# Do not change - the plugin uses this to upgrade old config files automatically.
config-version: 6

# Chat prefix (MiniMessage format)
prefix: "<gold>Halloween <dark_gray>» <gray>"

event:
  # true = event is always on (handy for testing)
  always-active: false
  # Inclusive dates, format yyyy-MM-dd (server local time)
  start-date: "2026-10-20"
  end-date: "2026-11-01"

pumpkin-hunt:
  spawn-interval-seconds: 60   # try to spawn one every N seconds
  max-active: 8                # max cursed pumpkins in the world at once
  min-distance: 15             # spawn distance from the chosen player
  max-distance: 50
  lifetime-seconds: 300        # despawn if nobody finds it
  candy-min: 3
  candy-max: 8

# Rules for RANDOM spawns. They only ever use an empty air block on natural
# ground under open sky with a free 3x3x2 area, so nothing gets overwritten
# and builds/caves are avoided.
spawning:
  worlds: []                   # empty = every overworld; or list world names
  safe-ground:
    - GRASS_BLOCK
    - DIRT
    - COARSE_DIRT
    - PODZOL
    - MYCELIUM
    - ROOTED_DIRT
    - SAND
    - RED_SAND
    - GRAVEL
    - STONE
    - SNOW_BLOCK
    - TERRACOTTA

trick-or-treat:
  auto-spawn:
    enabled: true              # temporary NPCs appear near random players
    interval-seconds: 300
    max-active: 3
    lifetime-seconds: 900      # they vanish after 15 min (never saved to the world)
    min-distance: 20
    max-distance: 60
  cooldown-seconds: 60
  trick-chance: 0.2            # 20% chance of a trick
  candy-min: 3
  candy-max: 8

# Haunted Zones: they appear by themselves (auto-spawn below) AND with a command:
# /halloween zone spawn [radius]  (or zone create <name> [radius]).
# A zone is centered on you with a Cursed Creaking Heart under your feet. It spreads until
# the heart is destroyed; then it is cleansed, deleted, and the land is restored.
# Inside an infected zone: ash fog, spooky sounds, monsters and bonus candy.
#
# Monsters here are FEW but fast, agile and strong, and they get much tougher every heart phase.
haunted-zones:
  default-radius: 30
  candy-multiplier: 2          # pumpkin + trick-or-treat candy is multiplied inside zones
  max-mobs-per-zone: 3         # base number of monsters per zone (grows near the heart / with phases)
  mob-spawn-interval-seconds: 10
  grace-seconds: 60            # a fresh zone is quiet for this long once a player is inside
  # Zombies/skeletons get a pumpkin helmet so they don't burn in daylight
  mobs: [ZOMBIE, SKELETON, SPIDER, WITCH]

  # EVERY hostile monster killed inside a zone drops candy (our own monsters and any other hostile mob).
  # The amount is multiplied by (1 + the monster's danger level): little at phase 0, a lot later.
  kill-candy-all: true
  kill-candy-chance: 1.0
  kill-candy-min: 1
  kill-candy-max: 2

  # Zones also appear by themselves near a random player. Careful: an infected zone eats builds
  # until its heart is destroyed! Set enabled: false to only use the command.
  auto-spawn:
    enabled: true
    first-delay-minutes: 5     # first zone appears this long after the server starts
    interval-minutes: 30       # then a new one this often (if there's room)
    max-zones: 1               # no new zone while this many exist
    min-distance: 60           # spawns this far from the chosen player
    max-distance: 140
    avoid-spawn-radius: 250    # never within this many blocks of world spawn

  # The Cursed Heart is a hive. The closer you get, the harder it gets.
  hive:
    # Level 1..5 by distance to the heart. Mob buffs, extra mob types and the aura below scale with it.
    level-distances: [80, 52, 32, 18, 8]
    mobs-per-level: 1          # extra monsters per spawn cycle for each level
    cap-per-level: 1           # extra max monsters for each level
    max-spawn-per-cycle: 2     # never more than this many new monsters per cycle at phase 0
    phase-spawn-bonus: 1       # ...plus this many for every heart phase
    phase-cap-bonus: 2         # extra max monsters for every heart phase
    extra-mobs:                # added to 'mobs' once you are this close
      level-2: [HUSK, STRAY, CAVE_SPIDER]
      level-3: [VINDICATOR, WITHER_SKELETON, PILLAGER]
      level-4: [RAVAGER, EVOKER, BREEZE]
      level-5: [RAVAGER, EVOKER, ILLUSIONER]
    # Elite guardians that keep standing around the heart (they respawn)
    sentries: 3
    phase-sentries: 1          # extra sentries for every heart phase
    sentry-range: 56           # sentries respawn while a player is this close
    sentry-mobs: [VINDICATOR, WITHER_SKELETON, RAVAGER, EVOKER]
    heart-hit-mobs: 1          # guardians that swarm you every time you hit the heart (+1 per phase)
    # Alarm: reaching this level makes the hive swarm you with guardians (0 = off)
    alarm-level: 4
    alarm-mobs: 3
    alarm-cooldown-seconds: 30
    # Aura on players near the heart (0 = off)
    darkness: true             # Darkness at level 3+
    slowness-level: 4          # Slowness from this level
    weakness-level: 5          # Weakness from this level
    heartbeat-range: 48        # you hear the heart this far away; it beats faster as you approach

# Infection: an infected zone keeps growing and eats the land (natural ground turns
# cursed, everything else in the top layers is destroyed, builds included) until its
# Cursed Creaking Heart is destroyed. Pale trees grow over the dead land. Everything it
# changed (trees and smashed lights too) is then restored. Chests, signs, beds and other
# containers are never touched. When the event ends, every infection is cleansed automatically.
infection:
  auto-start: true             # a new zone gets its heart and starts spreading right away
  start-radius: 6
  spread-blocks: 4             # every part of the infection grows by this much...
  spread-interval-seconds: 10  # ...every N seconds
  max-radius: 0                # 0 = never stops until the heart is destroyed
  depth: 6                     # how many blocks down from the surface are corrupted
  columns-per-tick: 30         # speed limits that keep the server smooth
  restore-blocks-per-tick: 300
  cleanse-reward: 50           # candy for the player who destroys the heart
  delete-zone-on-cleanse: true # destroying the heart also deletes the zone

  # LIGHT holds the infection back: the infection grows in 48 slices, and a slice can't grow
  # while a light source is in its way. Monsters hunt those lights and smash them (nothing
  # drops; every smashed light comes back when the land heals).
  light:
    enabled: true
    level: 8                   # block light needed on the ground to hold it back (a torch within ~6 blocks)
    lookahead: 3               # lights this far ahead of the front already stop it
    breakers: 2                # monsters sent to smash lights (while players are in the zone)
    break-seconds: 3           # how long a monster needs to smash a light
    mob-range: 64              # idle monsters this close go for lights

  # HUNGER: players on or near the infected area get hungry.
  hunger:
    enabled: true
    near-distance: 12          # also this far outside the infected area
    amplifier: 0               # +1 for every heart phase

  # PHASES: the bigger the infection, the stronger the heart. Each phase makes all monsters
  # tougher (and more of them), adds guardians, grows a shell around the heart, and makes
  # the heart take more hits to break (it heals when you stop hitting it).
  phases:
    radius: [40, 80, 140]                 # infection size that starts phase 1, 2, 3
    heart-hits: [3, 6, 10, 15]            # hits to destroy the heart in phase 0, 1, 2, 3
    heal-seconds: 8                       # the heart regains one hit this often when left alone
    shell: [AIR, DEEPSLATE_BRICKS, CRYING_OBSIDIAN, OBSIDIAN]   # blocks around the heart per phase (AIR = none)

  # Pale oak trees slowly grow over the infected area (placed only into empty air)
  trees:
    enabled: true
    chance: 0.02               # chance per infected column (0.02 = about one tree per 50 blocks)
    min-height: 4
    max-height: 7
    blocks-per-tick: 40        # growth speed

