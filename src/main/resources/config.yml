# ---------------------------------------------------------------------------
# Rare Merchant - only summoned with /halloween merchant. Each summon rolls a
# different set of goods from the pool below (random prices too). Stock is
# limited, so a merchant runs out. No inventory space = no sale and no charge.
#
# Gear is much better than a normal maxed item. On top of its enchantments (levels vanilla
# can't reach) every piece carries REAL bonuses, shown in its lore:
#   bonus-damage     extra damage on every hit (melee, arrows, bolts, tridents)
#   smash-bonus      mace only: extra damage per block fallen
#   damage-reduction extra % of damage ignored while worn (shields: while held)
#   unbreakable      never breaks
# Blast Protection is never added to armor (it would weaken wind charges and you couldn't
# wind-charge yourself upwards any more). Set allow-blast-protection: true to change that.
# Enchant format: name:level
# ---------------------------------------------------------------------------
merchant:
  name: "<dark_purple>Rare Merchant"
  offers-per-summon: 6         # max 14
  stock-per-offer: 1           # how many of each item can be bought
  price-variation: 0.15        # each summon the price is +/- 15%
  max-damage-reduction: 0.6    # armor bonuses add up to at most this much (0.6 = 60%)
  allow-blast-protection: false
  pool:
    reaper_edge:
      material: NETHERITE_SWORD
      name: "<dark_red>Reaper's Edge"
      lore: ["<gray>A blade that drinks souls", "<dark_purple>Rare Merchant exclusive"]
      cost: 2500
      bonus-damage: 8
      unbreakable: true
      enchants: ["sharpness:10", "fire_aspect:4", "looting:6", "sweeping_edge:6", "knockback:3", "unbreaking:10", "mending:1"]
    gilded_fang:
